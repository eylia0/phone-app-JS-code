<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Control Multi-File</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container" style="position: relative;">
        <header class="app-header">
            <div class="header-main">
                <h2>TradeLink BLE</h2>
                <span id="status-badge" class="badge disconnected">Disconnected</span>
            </div>
        </header>

        <main class="content-viewport">
            
            <section id="page-job-profile" class="step-view">
                <div class="banner">
                    <h3>Job Details</h3>
                    <p>Create a profile to begin configuring the Arduino.</p>
                </div>
                <div class="form-group">
                    <label>Job Name</label>
                    <input type="text" id="job-name" placeholder="e.g., Commercial Office Refit">
                </div>
                <div class="form-group">
                    <label>Location / Unit</label>
                    <input type="text" id="job-location" placeholder="e.g., Level 4, Room 402">
                </div>
                <button id="save-profile-btn" class="btn btn-primary">Next: Select Trade</button>
            </section>

            <section id="page-trade-grid" class="step-view hidden">
                <div class="banner">
                    <h3 id="active-profile-title">Project Profile</h3>
                    <p id="active-profile-meta">Location: Loading...</p>
                </div>
                <h4 class="section-title">Select a Trade Category</h4>
                
                <div class="trade-grid">
                    <div class="trade-tile hero-tile" data-file="trades/general.html">
                        <div class="tile-icon">🛠️</div>
                        <div class="tile-name">General Trade</div>
                    </div>
                    <div class="trade-tile" data-file="trades/electrical.html">
                        <div class="tile-icon">⚡</div>
                        <div class="tile-name">Electrical</div>
                    </div>
                    <div class="trade-tile" data-file="trades/plumbing.html">
                        <div class="tile-icon">💧</div>
                        <div class="tile-name">Plumbing</div>
                    </div>
                </div>
                <button class="btn btn-secondary-outline back-to-profile">‹ Edit Job Details</button>
            </section>

            <section id="page-dynamic-trade-view" class="step-view hidden">
                <div id="trade-file-content"></div>
                <button class="btn btn-secondary-outline back-to-trades">‹ Back to Trades</button>
            </section>

        </main>

        <div id="legal-modal-overlay" class="modal-overlay hidden">
            <div class="modal-card">
                <h3 id="modal-legal-title">National Electrical Code</h3>
                <div id="modal-legal-body" class="modal-body-content">
                    </div>
                <button id="close-legal-modal-btn" class="btn btn-primary" style="margin-top: 20px; padding: 10px;">Dismiss & Close</button>
            </div>
        </div>

    </div> <script src="app.js" type="module"></script>
</body>
</html>
